name: Listing share pages
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['listing-pages.mjs', '.github/workflows/listing-pages.yml']
permissions:
  contents: write
concurrency: listing-pages
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node listing-pages.mjs
      - name: Commit changed pages
        run: |
          git config user.name "jubilee-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A p
          git diff --cached --quiet || (git commit -m "Update listing share pages" && git push)
